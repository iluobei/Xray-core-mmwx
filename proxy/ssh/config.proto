syntax = "proto3";

package xray.proxy.ssh;
option csharp_namespace = "Xray.Proxy.Ssh";
option go_package = "github.com/xtls/xray-core/proxy/ssh";
option java_package = "com.xray.proxy.ssh";
option java_multiple_files = true;

import "common/protocol/user.proto";
import "common/net/address.proto";

// Account 是 SSH 入站的用户凭据:用户名 + 密码,和/或 authorized_keys 格式的公钥。
// 密码与公钥至少要有一样;两样都配时任一通过即可(与 OpenSSH 默认一致)。
message Account {
  string username = 1;
  string password = 2;
  // authorized_keys 行,例如 "ssh-ed25519 AAAA... comment"。
  repeated string authorized_keys = 3;
}

message ServerConfig {
  repeated xray.common.protocol.User users = 1;
  // 主机私钥(PEM,OpenSSH 或 PKCS#8 格式)。为空时启动时临时生成一把 ed25519,
  // 重启即变 —— 客户端配了 host-key 校验就会连不上,只适合本地调试。
  string host_key = 2;
  // 握手时对外宣称的版本串,为空用内置的 OpenSSH 伪装串。
  string server_version = 3;
}

// ClientConfig 是 SSH 出站:连上一台 SSH 服务器,每个代理请求开一个 direct-tcpip 通道(只支持 TCP)。
// 一个出站共用一条 SSH 连接,断了下次请求时重连。
message ClientConfig {
  xray.common.net.IPOrDomain address = 1;
  uint32 port = 2; // 0 = 22
  string user = 3; // 空 = root
  string password = 4;
  // 私钥(PEM,OpenSSH / PKCS#1 / PKCS#8),可带口令。
  string private_key = 5;
  string private_key_passphrase = 6;
  // 允许的服务器主机公钥(authorized_keys 格式,如 "ssh-ed25519 AAAA...")。空 = 接受任何主机公钥。
  repeated string host_key = 7;
  repeated string host_key_algorithms = 8;
  // 握手时的客户端版本串(须以 "SSH-2.0-" 开头)。空 = 随机一个 OpenSSH 版本串。
  string client_version = 9;
  repeated string ciphers = 10;
  repeated string macs = 11;
  repeated string kex_algorithms = 12;
}
