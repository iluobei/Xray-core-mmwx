syntax = "proto3";

package xray.transport.internet;
option csharp_namespace = "Xray.Transport.Internet";
option go_package = "github.com/xtls/xray-core/transport/internet";
option java_package = "com.xray.transport.internet";
option java_multiple_files = true;

import "common/serial/typed_message.proto";
import "common/net/address.proto";

enum DomainStrategy {
  AS_IS = 0;
  USE_IP = 1;
  USE_IP4 = 2;
  USE_IP6 = 3;
  USE_IP46 = 4;
  USE_IP64 = 5;
  FORCE_IP = 6;
  FORCE_IP4 = 7;
  FORCE_IP6 = 8;
  FORCE_IP46 = 9;
  FORCE_IP64 = 10;
}

enum AddressPortStrategy {
  None = 0;
  SrvPortOnly = 1;
  SrvAddressOnly = 2;
  SrvPortAndAddress = 3;
  TxtPortOnly = 4;
  TxtAddressOnly = 5;
  TxtPortAndAddress = 6;
}

message TransportConfig {
  // Transport protocol name.
  string protocol_name = 3;

  // Specific transport protocol settings.
  xray.common.serial.TypedMessage settings = 2;
}

message StreamConfig {
  xray.common.net.IPOrDomain address = 8;
  uint32 port = 9;

  // Effective network.
  string protocol_name = 5;

  repeated TransportConfig transport_settings = 2;

  // Type of security. Must be a message name of the settings proto.
  string security_type = 3;

  // Transport security settings. They can be either TLS or REALITY.
  repeated xray.common.serial.TypedMessage security_settings = 4;

  repeated xray.common.serial.TypedMessage udpmasks = 10;
  repeated xray.common.serial.TypedMessage tcpmasks = 11;

  QuicParams quic_params = 12;

  SocketConfig socket_settings = 6;
}

message QuicParams {
  string congestion = 1;
  string bbr_profile = 2;
  uint64 brutal_up = 3;
  uint64 brutal_down = 4;
  bool brutal_disable_loss_compensation = 5;
  uint64 init_stream_receive_window = 6;
  uint64 max_stream_receive_window = 7;
  uint64 init_conn_receive_window = 8;
  uint64 max_conn_receive_window = 9;
  int64 max_idle_timeout = 10;
  int64 keep_alive_period = 11;
  bool disable_path_mtu_discovery = 12;
  bool disable_chrome_parrot = 13;
  bool disableGSO = 14;
  int64 max_incoming_streams = 15;
  bool disable_stateless_reset = 16;    
}

message CustomSockopt {
  string system = 1;
  string network = 2;
  string level = 3;
  string opt = 4;
  string value = 5;
  string type = 6;
}

// SocketConfig is options to be applied on network sockets.
message SocketConfig {
  // Mark of the connection. If non-zero, the value will be set to SO_MARK.
  int32 mark = 1;

  // TFO is the state of TFO settings.
  int32 tfo = 2;

  enum TProxyMode {
    // TProxy is off.
    Off = 0;
    // TProxy mode.
    TProxy = 1;
    // Redirect mode.
    Redirect = 2;
  }

  // TProxy is for enabling TProxy socket option.
  TProxyMode tproxy = 3;

  // ReceiveOriginalDestAddress is for enabling IP_RECVORIGDSTADDR socket
  // option. This option is for UDP only.
  bool receive_original_dest_address = 4;

  bool accept_proxy_protocol = 7;

  // trust_loopback_proxy_protocol 宽容模式:**只信任来自本机的** PROXY 头,
  // 且不带头的连接照常放行。
  //
  // accept_proxy_protocol 用的是 REQUIRE —— 不带 PROXY 头的连接一律拒。放在
  // CDN/nginx 后面时这是对的(顺带挡掉直连),但「偷自己 tunnel 模式」不是那个场景:
  // 那里 443 上的 dokodemo 把流量转到本机内部端口,内部端口同时还可能被
  // 老订阅直连。用 REQUIRE 会把这些老客户端全部打断。
  //
  // 宽容模式下:本机来的连接有头就用(拿回真实客户端 IP)、没头也放行;
  // 外部来的连接一律忽略其 PROXY 头(防止有人伪造源 IP)。
  bool trust_loopback_proxy_protocol = 24;

  // trusted_proxy_protocol_sources 宽容模式的另一种:来源 IP 在这个列表里(单个 IP 或 CIDR)
  // 的连接,有 PROXY 头就用、没头也放行;其余来源的 PROXY 头读掉并忽略。
  //
  // 给转发链出口用:前一跳是链上自己的服务器(公网地址,不是本机),它们在连接开头补一个
  // PROXY 头把客户端真实 IP 带过来。只信任列表里的来源,别人伪造的头不生效;头是可选的,
  // 没升级、不发头的前一跳和直连的客户端都不受影响。可与 trust_loopback_proxy_protocol 同时用。
  repeated string trusted_proxy_protocol_sources = 25;

  // trusted_proxy_protocol_toa_only 只认 TOA:配合 trusted_proxy_protocol_sources 用,来源仍按那份列表采信 TOA
  // (宿主钩子,见 client_addr_hook.go),但所有来源的 PROXY 头一律读掉并忽略。
  // 转发链入口走内核转发(TOA)时客户端发的字节原样到出口,客户端自己写的 PROXY 头也会跟着过来;
  // 连接若恰好没带上 TOA,来源就是上一跳(可信),头就会被采信 —— 这种绑定的出口必须只认 TOA。
  bool trusted_proxy_protocol_toa_only = 26;

  // trusted_proxy_protocol_auth_context / _keys:可信来源的 PROXY 头要带签名(自定义 TLV 0xE5)才采信。
  // 配了 keys 时,可信来源发来的头必须带上用其中一把密钥算出的有效签名;没签名、签错、过期、重放的头
  // 一律读掉忽略(按连接的真实来源处理,不断连接)。context 参与签名,防止这条链的头拿到别的链上用。
  // keys 每项是 "<key_id>:<base64 密钥>",同时认多把(轮换时新旧两把都在)。
  string trusted_proxy_protocol_auth_context = 27;
  repeated string trusted_proxy_protocol_auth_keys = 28;

  DomainStrategy domain_strategy = 8;

  string dialer_proxy = 9;

  int32 tcp_keep_alive_interval = 10;

  int32 tcp_keep_alive_idle = 11;
  
  string tcp_congestion = 12;
  
  string interface = 13;

  bool v6only = 14;

  int32 tcp_window_clamp = 15;

  int32 tcp_user_timeout = 16;

  int32 tcp_max_seg = 17;

  bool penetrate = 18;

  bool tcp_mptcp = 19;

  repeated CustomSockopt customSockopt = 20;

  AddressPortStrategy address_port_strategy = 21;

  HappyEyeballsConfig happy_eyeballs = 22;

  repeated string trusted_x_forwarded_for = 23;
}

message HappyEyeballsConfig {
  bool prioritize_ipv6 = 1;
  uint32 interleave = 2;
  uint64 try_delayMs = 3;
  uint32 max_concurrent_try = 4;
}
